spring:
  datasource:
    url: jdbc:mysql://localhost:3306/mall?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: ${DB_PASSWORD}
    druid:
      initial-size: 5 #连接池初始化大小
      min-idle: 10 #最小空闲连接数
      max-active: 20 #最大连接数
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*"
      stat-view-servlet:
        login-username: druid
        login-password: druid
  data:
    redis:
      host: localhost
      database: 0 #本地单节点，通过 seckill: 前缀与 portal 隔离
      port: 6379
      password:
      timeout: 300ms
      lettuce:
        pool:
          max-active: 100
          max-idle: 20
          min-idle: 10
  rabbitmq:
    host: localhost
    port: 5672
    virtual-host: /mall
    username: mall
    password: mall
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        # 多消费者并行建单，提升落库吞吐；预取数按消费者计
        concurrency: 4
        max-concurrency: 8
        prefetch: 20

logging:
  level:
    root: info
    com.macro.mall: info
